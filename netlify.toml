[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/prompts"
  to = "/"
  status = 301

[[redirects]]
  from = "/prompts/"
  to = "/"
  status = 301

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[edge_functions]]
  function = "preview-robots"
  path = "/*"
